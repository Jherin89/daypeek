name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin # Apple Silicon
            os: macos-14
          - target: x86_64-apple-darwin # Intel Macs (cross-built on Apple Silicon)
            os: macos-14
          # Static musl binary: runs on any x86_64 Linux, whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the binary runs (and is static on Linux)
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/daypeek
          file "$BIN"
          "$BIN" --demo --compact --color never
          if [[ "${{ matrix.target }}" == *musl ]]; then
            file "$BIN" | grep -Eq 'static(-pie)? linked'
          fi

      - name: Package
        shell: bash
        run: |
          STAGE=daypeek-${{ matrix.target }}
          mkdir -p dist/$STAGE
          cp target/${{ matrix.target }}/release/daypeek dist/$STAGE/
          cp README.md LICENSE dist/$STAGE/
          tar -C dist -czf dist/$STAGE.tar.gz $STAGE
          # "<hash>  <file name>" with no directory, so `shasum -c` works
          # next to the download (install.sh only reads the hash).
          cd dist
          if command -v shasum >/dev/null; then
            shasum -a 256 $STAGE.tar.gz | tee $STAGE.sha256
          else
            sha256sum $STAGE.tar.gz | tee $STAGE.sha256
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/daypeek-${{ matrix.target }}.tar.gz
            dist/daypeek-${{ matrix.target }}.sha256
