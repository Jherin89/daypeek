name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon: exercises the cfg(target_os = "macos") paths.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all

      - name: demo smoke test
        run: cargo run --release -- --demo --compact

  install-script:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
      - name: dry run (no release yet → falls back to the cargo hint)
        run: sh install.sh --dry-run
